<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920" height="340">
  <rect x="0" y="0" width="920" height="340" fill="#F5F3EE" rx="12" ry="12"/>

  <!-- 白色卡片 -->
  <rect x="30" y="20" width="860" height="262" fill="#FFFFFF" stroke="#ECE8E0" rx="8" ry="8"/>
  <text x="460" y="50" text-anchor="middle" font-size="18" fill="#1F1E1D" font-weight="bold" font-family="Georgia, 'Times New Roman', 'Noto Serif SC', 'Songti SC', serif">Kernel 与数据传输时间轴</text>
  <text x="460" y="69" text-anchor="middle" font-size="11" fill="#8A857B" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">H2D → Kernel × 20 → D2H · 两个 GEMM 版本独立计时</text>

  <!-- 网格线与时间刻度（28 px/ms） -->
  <line x1="110" y1="84" x2="110" y2="226" stroke="#EDE9E1" stroke-width="1"/>
  <line x1="250" y1="84" x2="250" y2="226" stroke="#EDE9E1" stroke-width="1"/>
  <line x1="390" y1="84" x2="390" y2="226" stroke="#EDE9E1" stroke-width="1"/>
  <line x1="530" y1="84" x2="530" y2="226" stroke="#EDE9E1" stroke-width="1"/>
  <line x1="670" y1="84" x2="670" y2="226" stroke="#EDE9E1" stroke-width="1"/>
  <text x="110" y="242" text-anchor="middle" font-size="10" fill="#A39E92" font-family="'Helvetica Neue', Arial, sans-serif">0</text>
  <text x="250" y="242" text-anchor="middle" font-size="10" fill="#A39E92" font-family="'Helvetica Neue', Arial, sans-serif">5</text>
  <text x="390" y="242" text-anchor="middle" font-size="10" fill="#A39E92" font-family="'Helvetica Neue', Arial, sans-serif">10</text>
  <text x="530" y="242" text-anchor="middle" font-size="10" fill="#A39E92" font-family="'Helvetica Neue', Arial, sans-serif">15</text>
  <text x="670" y="242" text-anchor="middle" font-size="10" fill="#A39E92" font-family="'Helvetica Neue', Arial, sans-serif">20</text>
  <text x="460" y="264" text-anchor="middle" font-size="11" fill="#8A857B" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">时间 (ms)</text>

  <!-- 行 1：Naive GPU -->
  <text x="100" y="129" text-anchor="end" font-size="12" fill="#1F1E1D" font-weight="bold" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">Naive GPU</text>
  <rect x="110" y="102" width="42.6" height="44" fill="#7A9B8E" rx="3" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="131.3" y="129" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="bold" font-family="'Helvetica Neue', Arial, sans-serif">H2D ×2</text>
  <rect x="152.6" y="102" width="583.9" height="44" fill="#D97757" rx="3" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="444.6" y="130" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="bold" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">add kernel × 20 — 共 20.85 ms</text>
  <rect x="736.5" y="102" width="17.8" height="44" fill="#5B7B9A" rx="3" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="745.4" y="160" text-anchor="middle" font-size="9" fill="#8A857B" font-family="'Helvetica Neue', Arial, sans-serif">D2H</text>
  <text x="760" y="129" text-anchor="start" font-size="11" fill="#1F1E1D" font-weight="bold" font-family="'Helvetica Neue', Arial, sans-serif">≈23.0 ms</text>

  <!-- 行 2：Shared Memory Tiling -->
  <text x="100" y="188" text-anchor="end" font-size="12" fill="#1F1E1D" font-weight="bold" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">Shared</text>
  <text x="100" y="202" text-anchor="end" font-size="12" fill="#1F1E1D" font-weight="bold" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">Tiling</text>
  <rect x="110" y="170" width="42.6" height="44" fill="#7A9B8E" rx="3" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="131.3" y="197" text-anchor="middle" font-size="9" fill="#FFFFFF" font-weight="bold" font-family="'Helvetica Neue', Arial, sans-serif">H2D ×2</text>
  <rect x="152.6" y="170" width="450.4" height="44" fill="#D97757" rx="3" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="377.8" y="198" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="bold" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">shared_gemm kernel × 20 — 共 16.09 ms</text>
  <rect x="603.0" y="170" width="17.8" height="44" fill="#5B7B9A" rx="3" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="611.9" y="228" text-anchor="middle" font-size="9" fill="#8A857B" font-family="'Helvetica Neue', Arial, sans-serif">D2H</text>
  <text x="627" y="197" text-anchor="start" font-size="11" fill="#1F1E1D" font-weight="bold" font-family="'Helvetica Neue', Arial, sans-serif">≈18.2 ms</text>

  <!-- 图例 -->
  <rect x="330" y="302" width="13" height="13" fill="#D97757" rx="3"/>
  <text x="351" y="313" text-anchor="start" font-size="11" fill="#1F1E1D" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">Kernel 计算</text>
  <rect x="450" y="302" width="13" height="13" fill="#7A9B8E" rx="3"/>
  <text x="471" y="313" text-anchor="start" font-size="11" fill="#1F1E1D" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">H2D 传输</text>
  <rect x="570" y="302" width="13" height="13" fill="#5B7B9A" rx="3"/>
  <text x="591" y="313" text-anchor="start" font-size="11" fill="#1F1E1D" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">D2H 传输</text>
</svg>
