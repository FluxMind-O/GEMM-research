  <rect x="375" y="332" width="13" height="13" fill="#D97757" rx="3"/>
  <text x="396" y="343" text-anchor="start" font-size="11" fill="#1F1E1D" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">Shared Memory Tiling</text>
